<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECF scanner beta</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a2f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#1d2a2f;--chalk:#f2f4f3;--steel:#5b6b70;--line:#d5dcda;--go:#1fb85a;--hold:#f0a020;--bad:#d6393f;--card:#fff;--soft:#e8edeb}
*{box-sizing:border-box}
body{margin:0;background:var(--chalk);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:10px 10px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.15rem;margin:4px 0}
.beta{display:inline-block;background:var(--hold);color:var(--ink);font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:999px;vertical-align:2px;letter-spacing:.04em}
#q{font-size:.8rem;color:var(--steel);text-align:right}#q.bad{color:var(--bad);font-weight:600}#q.warn{color:#b26a00;font-weight:600}
button,select,input[type=text],input[type=password],input[type=number],textarea{font:inherit;min-height:46px;border-radius:8px}
button{padding:10px 14px;border:0;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{background:var(--line);color:var(--steel);cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
button.go{background:var(--go)}button.warn{background:var(--hold);color:var(--ink)}button.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}button.danger{background:var(--bad)}
button.sm{min-height:34px;padding:4px 10px;font-size:.85rem}
select,input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:8px 10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
label.f{display:block;font-size:.8rem;color:var(--steel);margin:6px 0 2px}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
.half{flex:1;min-width:130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.seg{display:flex;gap:0;margin:0}
.seg button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:8px 4px;min-height:42px}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button+button{border-left:0}
.seg button.on{background:var(--go);border-color:var(--go);color:#fff;font-weight:600}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.modes button{flex:1 1 30%;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:8px 2px;min-height:42px;font-size:.9rem}
.modes button.on{background:var(--go);border-color:var(--go);color:#fff;font-weight:600}
#roles{display:grid;gap:10px;margin-top:14px}
#roles button{min-height:84px;font-size:1.15rem;text-align:left;padding:14px 18px;background:#fff;color:var(--ink);border:2px solid var(--ink)}
#roles button small{display:block;font-weight:400;color:var(--steel);font-size:.8rem;margin-top:2px}
#cam{position:relative;background:#101719;border-radius:10px;overflow:hidden;height:0;padding-top:70%}
#cam video,#cam canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#msg{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;background:rgba(16,23,25,.72);color:#fff;font-size:.85rem}
#cap{width:100%;font-weight:600}#cap.ready{background:var(--go)}
#cur{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px;min-height:70px}
#cur.ok{border-color:var(--go)}#cur.hold{border-color:var(--hold);background:#fff8e8}#cur.bad{border-color:var(--bad);background:#fdeceb}
#cur .big{font-size:1.1rem;font-weight:700}#cur .mut{color:var(--steel);font-size:.85rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);margin:2px 4px 2px 0}
.tag.amber{background:var(--hold)}.tag.red{background:var(--bad);color:#fff}.tag.green{background:var(--go);color:#fff}
ul.list{list-style:none;margin:6px 0;padding:0}
ul.list li{padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;margin-bottom:4px}
ul.list li.sel{border:2px solid var(--go)}
ul.list li .sub{color:var(--steel);font-size:.8rem}
ul.list li .w{color:#b26a00;font-size:.8rem}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--go)}
.sec{font-size:.8rem;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
#tot{font-weight:600}
#info,#ver{color:var(--steel);font-size:.75rem}
.banner{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:.9rem}
.banner.amber{background:#fff1d6;border:1px solid var(--hold)}.banner.red{background:#fdeceb;border:1px solid var(--bad)}
[hidden]{display:none!important}
#modal,#settings{position:fixed;inset:0;background:rgba(16,23,25,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
#modal .box,#settings .box{background:#fff;border-radius:12px;padding:14px;width:100%;max-width:480px;margin-top:6vh}
#modal h2,#settings h2{margin:0 0 6px;font-size:1.1rem}
#modal .row button{flex:1}
</style>
</head>
<body>
<script>window.onerror=function(m,u,l){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#d6393f;color:#fff;padding:8px 12px;font:14px sans-serif';d.textContent='Error: '+m+' (line '+l+')';document.body.appendChild(d)};</script>
<main>
<header>
  <div><h1>ECF scanner <span class="beta">BETA</span></h1><button id="rolebtn" class="sm ghost" hidden></button></div>
  <div id="q"></div>
</header>
<div id="banners">
  <button id="install" hidden class="go" style="width:100%;margin:6px 0">Install app on this phone</button>
  <button id="upd" hidden class="warn" style="width:100%;margin:6px 0">New version ready: tap to reload</button>
  <div id="setupnote" class="banner amber" hidden></div>
</div>

<section id="rolescreen" hidden>
  <p style="margin:6px 0">Who is using this phone now?</p>
  <div id="roles"></div>
  <div class="row"><button id="openset1" class="ghost sm">Settings</button></div>
</section>

<section id="work" hidden>
  <div class="modes" id="modes"></div>
  <div id="opts" class="card"></div>

  <div id="cur">Pick a mode, then scan a pack label.</div>

  <div class="row"><select id="src" aria-label="Input source"><option value="cam">Input: phone camera</option><option value="bt">Input: handheld Bluetooth scanner</option></select></div>
  <div id="cam" class="camonly"><video id="v" playsinline muted></video><canvas id="o"></canvas><div id="msg">Camera is off</div></div>
  <div class="row camonly"><button id="power" style="flex:1">Enable camera</button><button id="torch" hidden>Torch</button></div>
  <div id="btui" hidden><label for="scan" style="font-size:.85rem;color:var(--steel)">Handheld scanner: pull the trigger to scan</label><input type="text" id="scan" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Waiting for scanner…"><div id="dbg" style="font-size:.75rem;color:var(--steel)">Scanner readout: waiting for a key</div></div>
  <div class="row camonly">
    <select id="auto" class="half" aria-label="Scan mode"><option value="1">Auto scan</option><option value="0" selected>Manual scan</option></select>
    <select id="dup" class="half" aria-label="Repeat rule"><option value="rearm">Repeat after code leaves frame</option><option value="strict" selected>No repeat until new code</option></select>
  </div>
  <button id="cap" class="camonly" disabled>Capture</button>

  <div id="modearea"></div>

  <div class="row"><input type="text" id="note" placeholder="Note (people only, saved with each scan)" aria-label="Note"></div>

  <div class="sec">Recent scans</div>

</section>

<p id="info"></p>
<p id="ver"></p>
</main>

<div id="modal" hidden><div class="box"><h2 id="mt"></h2><div id="mb"></div><div class="row" id="mbtn"></div></div></div>

<div id="settings" hidden><div class="box">
  <h2>Settings</h2>
  <label class="f" for="s_dev">Device name (once per phone, e.g. Packing, Market 1)</label>
  <input type="text" id="s_dev" autocomplete="off">
  <label class="f" for="s_url">Web app address (Apps Script)</label>
  <input type="text" id="s_url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="f" for="s_tok">Device token</label>
  <input type="password" id="s_tok" autocomplete="off">
  <div class="row"><button id="s_save" class="go half">Save and connect</button><button id="s_close" class="ghost half">Close</button></div>
  <div class="row"><button id="s_send" class="ghost half sm">Send queue now</button><button id="s_clear" class="ghost half sm">Clear cached data</button></div>
  <div id="s_status" class="sub" style="font-size:.85rem;color:var(--steel)"></div>
</div></div>

<script>
/* ============================== constants ============================== */
const BUILD='vB0.1.3';
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbyx2IrRDLzrY4J_yH5TUdAi8QVsR4hpaZvZeYHevBeIUjIxjGNHkjU9S1_ooV4S2Yvn/exec';   // paste the Apps Script web app address (ending /exec) between the quotes and the phones need no setup for it   // keep in step with V in sw.js
const ROLES=[
 {name:'Meat Packing',sub:'IN: put new packs into stock'},
 {name:'Order Packing',sub:'Pick list for webshop orders'},
 {name:'Manage Stock',sub:'OUT, Return, Freeze, boxes, stocktake, fix-ups'},
 {name:'Selling',sub:'Sell at the shop, markets, family, special orders'}];
const MODES={'Meat Packing':['IN'],'Order Packing':['Pick'],
 'Manage Stock':['Out','Return','Freeze','Thaw','Allocate online','Remove online','Write-off','Build box','Unpack','Stocktake','Fix-ups'],
 'Selling':['Sell']};
const SALE_TYPES=['Shop','Market NFM','Market MOT','Market TAK','Family','Special order'];
const OUT_DEST=['Shop','Market NFM','Market MOT','Market TAK','Retailer','Special order'];
const RETURN_FROM=['Market NFM','Market MOT','Market TAK','Shop','Special order','Web order'];
const WRITEOFF_WHY=['Damaged','Out of date','Mislabelled','Dropped','Quality','Other'];
const ST_LOCS=['Chiller','Freezer','Shop','Market'];
const REMOVES={Sell:1,Out:1,Writeoff:1,Offline:1,Missing:1};   // actions that can take a pack out of the online pool
const GO='#1fb85a',HOLD='#f0a020',IDLE=60000,REARM=1500;

/* ============================== state ============================== */
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{const v=localStorage.getItem('ecfb.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem('ecfb.'+k,JSON.stringify(v))}catch(e){}};
let cfg=LS('cfg',{url:'',token:'',device:''}),ref=LS('ref',null),queue=LS('q',[]),recent=LS('recent',[]),ctr=LS('ctr',0),role=LS('role','');
if(!cfg.url&&DEFAULT_URL)cfg.url=DEFAULT_URL;
let mode='',busy=false,refBusy=false,lastErr='',modalOpen=false;
let sticky={temp:'Chilled',online:'',origin:'',animal:'',dest:'Shop',from:'Market NFM',why:'Damaged',stype:'Shop',ref:''};
let basket=[],bsel=-1,boxB=null,st=null,doneBox=null,scanLog=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const pad=n=>String(n).padStart(2,'0');
const nowIso=()=>new Date().toISOString();
const hhmm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};
const slug=()=>(cfg.device||'dev').replace(/[^A-Za-z0-9]/g,'').slice(0,6)||'dev';
function newId(){ctr++;SV('ctr',ctr);return slug()+'-'+Date.now().toString(36)+ctr.toString(36)+Math.floor(Math.random()*1296).toString(36)}
function ymdhms(d){d=d||new Date();return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())}

/* ============================== reference data ============================== */
const prodMap=()=>{const m={};((ref&&ref.products)||[]).forEach(p=>{m[p.plu]=p});return m};
let PM=prodMap();
const S=()=>(ref&&ref.settings)||{};
function plist(){return (ref&&ref.products)||[]}
function variantOf(origin){
  const o=String(origin||'').toLowerCase();let hits=[];
  ((ref&&ref.variants)||[]).forEach(v=>{if(!v.suffix)return;for(const w of v.words||[])if(w&&o.indexOf(w)>=0){hits.push(v);break}});
  return{suffix:hits.length?hits[0].suffix:'',name:hits.length?hits[0].name:'',multi:hits.length>1};
}
async function refresh(manual){
  if(refBusy||!cfg.url)return;refBusy=true;
  try{
    const u=cfg.url+(cfg.url.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(cfg.token||'');
    const r=await fetch(u,{redirect:'follow'}),j=await r.json();
    if(!j.ok){lastErr=j.error==='Bad token'?'The web app refused the device token.':(j.error||'Web app error');showStatus();return}
    ref=j;ref.fetched=nowIso();SV('ref',ref);PM=prodMap();lastErr='';
    if(!sticky.origin&&S().defaultOrigin)sticky.origin=S().defaultOrigin;
    renderOpts();showStatus();if(manual)setStat('Connected to web app version '+j.version+'. '+plist().length+' products.');
  }catch(e){if(manual)setStat('Could not reach the web app ('+e.message+'). Check: the address ends in /exec; the deployment\'s "Who has access" is Anyone; the phone has a connection. Test by opening the address with ?token=your-token on the end in the phone browser: it should show text starting {"ok":true.')}
  finally{refBusy=false;showStatus();checkSetup()}
}
function setStat(t){$('s_status').textContent=t}
setInterval(()=>{if(navigator.onLine&&cfg.url&&!document.hidden)refresh()},5*60000);

/* ============================== queue and upload ============================== */
function saveQ(){SV('q',queue);SV('recent',recent.slice(-40));showStatus()}
function showStatus(){
  const e=$('q');let t=[],cls='';
  if(!navigator.onLine)t.push('Offline');
  t.push(queue.length?'Waiting to send: '+queue.length:'All sent');
  if(!cfg.url){t.push('Not set up');cls='warn'}
  else if(lastErr){t.push(lastErr);cls='bad'}
  else if(ref&&ref.fetched){const age=(Date.now()-new Date(ref.fetched))/60000;t.push('Data '+hhmm(ref.fetched));if(age>60)cls='warn'}
  else{t.push('No data yet');cls='warn'}
  if(queue.length>20)cls='bad';
  e.textContent=t.join(' · ');e.className=cls;
}
function enqueue(events,label,extra){
  const ids=events.map(e=>e.id);
  events.forEach(e=>queue.push(e));
  recent.push(Object.assign({ids,label,time:nowIso(),status:'queued',warn:'',voided:false},extra||{}));
  saveQ();renderRecent();flush();
}
async function flush(){
  if(busy||!queue.length||!cfg.url)return;busy=true;
  try{
    const batch=queue.slice(0,50);
    const c=window.AbortController?new AbortController():null,to=setTimeout(()=>c&&c.abort(),25000);
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,events:batch}),signal:c&&c.signal,redirect:'follow'});
    clearTimeout(to);const j=await r.json();
    if(!j.ok){lastErr=j.error==='Bad token'?'The web app refused the device token.':(j.error||'Web app error');busy=false;showStatus();return}
    lastErr='';
    const got={};(j.stored||[]).forEach(id=>got[id]=1);
    queue=queue.filter(e=>!got[e.id]);
    recent.forEach(r=>{if(r.ids.some(id=>got[id])){r.status='sent';const w=r.ids.map(id=>(j.warnings||{})[id]).filter(Boolean);if(w.length)r.warn=w.filter((x,i)=>w.indexOf(x)===i).join('; ')}});
    saveQ();renderRecent();busy=false;
    if(queue.length)flush();else refresh();
  }catch(e){busy=false}
}
setInterval(flush,4000);addEventListener('online',()=>{showStatus();flush();refresh()});addEventListener('offline',showStatus);
addEventListener('beforeunload',e=>{if(queue.length){e.preventDefault();e.returnValue=''}});

/* ============================== audio ============================== */
let ac;
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(f,ms){audio();if(!ac)return;const t=ac.currentTime,g=ac.createGain(),s=ac.createOscillator();s.frequency.value=f;s.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,t);g.gain.setValueAtTime(0,t+ms/1e3);s.start(t);s.stop(t+ms/1e3+.02)}
const okTone=()=>{beep(1200,90);navigator.vibrate&&navigator.vibrate(40)};
const warnTone=()=>{beep(700,120);setTimeout(()=>beep(900,120),160);navigator.vibrate&&navigator.vibrate([60,40,60])};
const badTone=()=>{beep(220,140);setTimeout(()=>beep(220,140),220);navigator.vibrate&&navigator.vibrate([80,60,80])};

/* ============================== barcodes ============================== */
function okEAN(s){let t=0;for(let i=0;i<12;i++)t+=(+s[i])*(i%2?3:1);return (10-t%10)%10===+s[12]}
function gtinOk(g){if(!/^\d{14}$/.test(g))return false;let t=0;for(let i=0;i<13;i++)t+=(+g[i])*(i%2?1:3);return (10-t%10)%10===+g[13]}
function parseGs1(s){
  s=String(s).replace(/^\]C1/,'');const res={},sep=/[\x1d~|]/;let m;
  if(s.indexOf('(')>=0){const re=/\((\d{2,4})\)([^(]*)/g;while((m=re.exec(s)))res[m[1]]=m[2].replace(/[\x1d~|]/g,'')}
  else{
    if(!/^01\d{14}/.test(s))return null;
    const fixed={'01':14,'11':6,'13':6,'15':6,'17':6};let i=0;
    while(i<s.length){
      if(sep.test(s[i])){i++;continue}
      const a2=s.substr(i,2),a4=s.substr(i,4);
      if(a4==='8008'){res['8008']=s.substr(i+4,12);i+=16}
      else if(fixed[a2]){res[a2]=s.substr(i+2,fixed[a2]);i+=2+fixed[a2]}
      else if(/^310\d$/.test(a4)){res[a4]=s.substr(i+4,6);i+=10}
      else if(/^392\d$/.test(a4)||a2==='21'||a2==='10'){const ai=/^392\d$/.test(a4)?a4:a2;let k=i+ai.length;const j=k;while(k<s.length&&!sep.test(s[k]))k++;res[ai]=s.substring(j,k);i=k}
      else return null;
    }
  }
  return(res['01']&&(res['8008']||res['21']))?res:null;
}
const gsDate=v=>/^\d{6}$/.test(v||'')?'20'+v.substr(0,2)+'-'+v.substr(2,2)+'-'+v.substr(4,2):'';
/** Reads any scan. kind: ean13 (old label, stored "A"+13 digits), gs1 (new label), box, other. */
function parseScan(raw){
  raw=String(raw==null?'':raw).trim();
  const o={raw,kind:raw?'other':'none',code:raw,plu:'',kg:'',price:'',serial:'',packed:'',best:'',err:''};
  const m=/^A?(\d{11,13})$/.exec(raw);
  if(m){const d=('0000000000000'+m[1]).slice(-13);if(okEAN(d)){Object.assign(o,{kind:'ean13',code:'A'+d,plu:d.slice(0,3),kg:+d.slice(3,7)/1000,price:+d.slice(7,12)/100});return o}}
  if(/^BOX[-A-Z0-9]+$/i.test(raw)){o.kind='box';o.code=raw.toUpperCase();return o}
  const g=parseGs1(raw);
  if(g){
    if(!gtinOk(g['01'])){o.err='GTIN check digit is wrong';return o}
    const order=['01','3103','8008','21','15','17','3922'],keys=order.filter(k=>g[k]).concat(Object.keys(g).filter(k=>order.indexOf(k)<0));
    o.kind='gs1';o.code=keys.map(k=>'('+k+')'+g[k]).join('');o.plu=g['01'].slice(10,13);
    o.serial=g['01']+'-'+(g['8008']||g['21']);
    Object.keys(g).forEach(ai=>{if(/^310\d$/.test(ai))o.kg=+g[ai]/Math.pow(10,+ai[3]);if(/^392\d$/.test(ai))o.price=+g[ai]/Math.pow(10,+ai[3])});
    o.packed=gsDate(g['8008']?g['8008'].slice(0,6):'');o.best=gsDate(g['15']||g['17']);
  }
  return o;
}

/* Band rule (same as the Sheet's Code.gs) */
function bandFor(wKg,labelPrice,p,s){
  const w=wKg*1000,inc=(p&&p.inc>0)?p.inc:100;
  const max50=(p&&p.max50!==''&&p.max50!=null&&!isNaN(+p.max50))?+p.max50:(s.default50==null?300:s.default50);
  const half=inc/2,e=1e-9;
  const dn50=Math.max(1,Math.floor(w/half+e))*half,up50=Math.ceil(w/half-e)*half,dn=Math.max(1,Math.floor(w/inc+e))*inc,up=Math.ceil(w/inc-e)*inc;
  const lo=w>max50?dn:dn50,hi=w>max50?up:up50;
  const perKg=wKg>0?Math.round(labelPrice/wKg*10)/10:0;
  const maxOver=Math.min(s.maxOverAbs==null?1:s.maxOverAbs,(s.maxOverPct==null?.2:s.maxOverPct)*labelPrice);
  let sel=lo;
  if(w-lo>=(1-(s.underMargin==null?.3:s.underMargin))*(hi-lo)-e)sel=(hi*perKg/1000-labelPrice>=maxOver)?lo:hi;
  const over=(sel/1000-wKg)*perKg;
  return{band:sel,over,tooLow:over<(s.maxUnder==null?-2.5:s.maxUnder),perKg};
}
const keyOf=(plu,variant,band,temp)=>plu+(variant?'-'+variant:'')+'-'+band+'-'+(/^f/i.test(temp)?'F':'C');
/** Product, band, stock key and flags for a scanned pack. */
function analyse(pr,temp,variant){
  const s=S(),p=PM[pr.plu]||null,a={p,flags:[],under:false,band:'',webPlu:pr.plu,variant:variant||'',key:'',perKg:null,known:!!p};
  if(!p)a.flags.push('Unknown PLU '+pr.plu);
  if(p&&s.lambHogget&&p.hogget)a.webPlu=p.hogget;
  const w=pr.kg;let band='';
  if(w!==''&&w<=0.0011)band=(p&&p.fixedG>0)?p.fixedG:(s.defaultFixedG||1000);
  else if(p&&/item/i.test(p.basis||''))band=0;
  else if(w>0){const b=bandFor(w,pr.price,p,s);band=b.band;a.under=b.tooLow;a.perKg=b.perKg;if(p&&b.perKg!==p.price)a.flags.push('Label price differs from schedule')}
  a.band=band;if(band!=='')a.key=keyOf(a.webPlu,a.variant,band,temp);
  return a;
}
/** Online, claims and spare for a band (variants added together because old labels do not carry one). */
function stockInfo(a,temp){
  if(!ref||!ref.stock||a.band==='')return null;
  const t=/^f/i.test(temp)?'F':'C',re=new RegExp('^'+a.webPlu+'(-[A-Z0-9]+)*-'+a.band+'-'+t+'$');
  let r={inStock:0,online:0,claims:0,found:false};
  ref.stock.forEach(x=>{if(re.test(x.key)){r.found=true;r.inStock+=+x.inStock||0;r.online+=+x.online||0;r.claims+=+x.claims||0}});
  r.spare=r.online-r.claims;return r.found?r:null;
}
const short=i=>i&&i.online>0&&i.claims>0&&i.spare<=0;
function localTake(a,temp){   // keep the on-phone counts roughly right until the next refresh
  const i=stockInfo(a,temp);if(!i)return;
  const t=/^f/i.test(temp)?'F':'C',re=new RegExp('^'+a.webPlu+'(-[A-Z0-9]+)*-'+a.band+'-'+t+'$');
  for(const x of ref.stock)if(re.test(x.key)){x.inStock=Math.max(0,(+x.inStock||0)-1);if(x.online>0)x.online--;break}
  SV('ref',ref);
}
function nameOfKey(key){
  const parts=String(key).split('-'),p=PM[parts[0]];
  const f=parts[parts.length-1]==='F'?'frozen':'chilled',g=parts[parts.length-2];
  return(p?p.name:'PLU '+parts[0])+' '+g+' g '+f;
}

    modalOpen=true;$('mt').textContent=title;$('mb').innerHTML=html||'';
    const bx=$('mbtn');bx.innerHTML='';
    (btns||[{t:'OK',v:true,c:'go'}]).forEach(b=>{const e=document.createElement('button');e.textContent=b.t;e.className=b.c||'';e.onclick=()=>{
      const val=typeof b.v==='function'?b.v():b.v;if(val===undefined)return;modalOpen=false;$('modal').hidden=true;res(val)};bx.appendChild(e)});
    $('modal').hidden=false;
  });
}

async function shortGate(list){   // list of {name,info}; returns true to go ahead
  const bad=list.filter(x=>short(x.info));if(!bad.length)return true;
  warnTone();
  return confirmD('Order would be left short',bad.map(x=>'<p><b>'+esc(x.name)+'</b><br>Open web orders need '+x.info.claims+' of '+x.info.online+' packs in this band. Taking this one leaves an order short.</p>').join('')+'<p>Continue logs the event and raises a shortage alert.</p>','Continue');
}

/* ============================== recent scans and undo ============================== */
function renderRecent(){
  const u=$('recent');if(!u)return;
  const list=recent.slice(-8).reverse();
  u.innerHTML=list.map((r,i)=>'<li><div class="line"><div><b>'+esc(r.label)+'</b><div class="sub">'+hhmm(r.time)+' · '+(r.voided?'cancelled':(r.status==='sent'?'sent':'waiting to send'))+'</div>'+(r.warn?'<div class="w">⚠ '+esc(r.warn)+'</div>':'')+'</div>'+
    (r.voided||r.noUndo?'':'<button class="sm ghost" data-u="'+(recent.length-1-i)+'">Undo</button>')+'</div></li>').join('')||'<li class="sub">Nothing yet.</li>';
  Array.prototype.forEach.call(u.querySelectorAll('button[data-u]'),b=>b.onclick=()=>undo(+b.dataset.u));

async function undo(i){
  const r=recent[i];if(!r||r.voided)return;
  if(!await confirmD('Undo this scan?','<p>'+esc(r.label)+'</p><p>A cancelling entry is added. The original stays in the log.</p>','Undo'))return;
  const evs=r.ids.map(id=>mkEvent('Void','',{linked:id,note:'Undo: '+r.label}));
  r.voided=true;evs.forEach(e=>queue.push(e));
  recent.push({ids:evs.map(e=>e.id),label:'Undo: '+r.label,time:nowIso(),status:'queued',warn:'',voided:false,noUndo:true});
  saveQ();renderRecent();flush();
}

/* ============================== result card ============================== */
function showCard(cls,html){const c=$('cur');c.className=cls;c.innerHTML=html}
function stockLine(a,temp){
  const i=stockInfo(a,temp);if(!i)return'';
  return'<div class="mut">'+esc(a.key||'')+' · online '+i.online+' · open orders '+i.claims+' · spare '+i.spare+'</div>';
}
function packHtml(pr,a,extra,tags){
  const t=(tags||[]).map(x=>'<span class="tag '+(x[1]||'')+'">'+esc(x[0])+'</span>').join('');
  const w=pr.kg!==''?(pr.kg<=0.0011?'':pr.kg.toFixed(3)+' kg · '):'';
  return'<div class="big">'+esc(labelOf(pr,a))+'</div><div class="mut">'+w+(pr.price!==''?'$'+Number(pr.price).toFixed(2)+' · ':'')+(pr.kind==='gs1'?'new label':'old label')+(pr.packed?' · packed '+pr.packed:'')+(pr.best?' · best before '+pr.best:'')+'</div>'+(extra||'')+'<div>'+t+'</div>';
}
function dupCheck(pr,a,type){
  if(pr.kind!=='ean13'||!a.p)return false;
  const s=S(),ex=(s.dupCat||[]).indexOf((a.p.type||'').toLowerCase())>=0||(s.dupType||[]).indexOf((a.p.category||'').toLowerCase())>=0;
  const now=Date.now(),win=(s.dupSeconds||60)*1000;
  const hit=scanLog.slice(-3).some(x=>x.code===pr.code&&x.type===type&&now-x.t<=win);
  scanLog.push({code:pr.code,type,t:now});scanLog=scanLog.slice(-10);
  return hit&&!ex;
}

/* ============================== scan handling ============================== */
function scanBad(t,why){
  badTone();showCard('bad','<div class="big">Not a valid pack barcode</div><div class="mut">'+esc(why||'')+'</div><b>'+esc(t||'(empty)')+'</b>');
}
async function onScan(raw,pre){
  if(modalOpen||!mode)return;
  const pr=pre||parseScan(raw);
  if(pr.err&&!(mode==='Build box'&&boxB&&boxB.awaiting))return scanBad(pr.raw,pr.err);
  if(mode==='Build box'&&boxB&&boxB.awaiting&&pr.kind!=='none')return doBoxLabel(pr);
  const known=pr.kind!=='none'?findBoxByScan(pr.code||pr.raw):null;
  if(known){pr.kind='box';pr.boxRec=known;pr.code=known.id}
  if(pr.kind==='none'||pr.kind==='other')return scanBad(pr.raw,'Only pack labels and box labels are accepted.');
  try{
    if(mode==='IN')return await doIn(pr);
    if(mode==='Pick')return await doPick(pr);
    if(mode==='Sell')return doBasket(pr);
    if(mode==='Build box')return doBoxScan(pr);
    if(mode==='Stocktake')return doStScan(pr);
    if(mode==='Unpack')return await doUnpackScan(pr);
    if(mode==='Fix-ups'){return scanBad(pr.raw,'Fix-ups work from the stock list below, not by scanning.')}
    return await doSimple(pr);
  }catch(e){badTone();showCard('bad','Error: '+esc(e.message))}
}
/* IN */
async function doIn(pr){
  if(pr.kind==='box')return scanBad(pr.raw,'A box cannot be packed in. Use Manage Stock > Unpack.');
  const origin=($('o_origin')?$('o_origin').value:sticky.origin).trim(),v=variantOf(origin),a=analyse(pr,sticky.temp,v.suffix);
  const ev=mkEvent('Pack',pr.code,{online:sticky.online,temperature:sticky.temp,farmOrigin:origin,animalCode:($('o_animal')?$('o_animal').value:sticky.animal).trim()});
  const tags=[[sticky.temp,'']],warn=[];
  tags.push([sticky.online==='Offline'?'Offline only':(a.under&&sticky.online!=='Online'&&S().underpricedOffline!==false?'Offline only (underpriced)':'Online'),a.under?'amber':'green']);
  if(a.under)tags.push(['UNDERPRICED','amber']);if(v.suffix)tags.push([v.name,'']);
  a.flags.forEach(f=>{tags.push([f,'amber']);warn.push(f)});
  if(dupCheck(pr,a,'Pack')){tags.push(['Possible double scan','amber']);warn.push('double')}
  enqueue([ev],'IN '+labelOf(pr,a));
  (warn.length||a.under)?warnTone():okTone();
  showCard(warn.length||a.under?'hold':'ok',packHtml(pr,a,'<div class="mut">Band '+(a.band===''?'?':a.band+' g')+' · '+esc(a.key)+'</div>',tags)+(warn.indexOf('double')>=0?'<button class="sm warn" id="undonow">Undo this scan</button>':''));
  if($('undonow'))$('undonow').onclick=()=>undo(recent.length-1);
}
/* simple actions on a pack or box */
const SIMPLE={Out:'Out',Return:'Return',Freeze:'Freeze',Thaw:'Thaw','Allocate online':'Online','Remove online':'Offline','Write-off':'Writeoff'};
function simpleFields(){
  const t={};
  if(mode==='Out'){t.type2=($('o_dest')||{}).value||sticky.dest;t.reference=($('o_ref')?$('o_ref').value:sticky.ref).trim()}
  if(mode==='Return'){t.type2=($('o_from')||{}).value||sticky.from;t.online=sticky.online}
  if(mode==='Write-off')t.type2=($('o_why')||{}).value||sticky.why;
  return t;
}
async function doSimple(pr){
  const type=SIMPLE[mode],f=simpleFields();
  if(pr.kind==='box')return await doBoxAction(pr,type,f);
  const temp=tempFor(pr,mode),a=analyse(pr,temp||'Chilled',''),info=stockInfo(a,temp||'Chilled'),warn=[];
  if(REMOVES[type]&&!await shortGate([{name:labelOf(pr,a),info}]))return showCard('hold','Cancelled. Nothing was saved.');
  const ev=mkEvent(type,pr.code,Object.assign({temperature:type==='Freeze'?'Frozen':(type==='Thaw'?'Chilled':temp)},f));
  const tags=[[mode+(f.type2?': '+f.type2:''),'green']];
  if(temp)tags.push([temp,'']);
  a.flags.forEach(x=>{tags.push([x,'amber']);warn.push(x)});
  if(dupCheck(pr,a,type)){tags.push(['Possible double scan','amber']);warn.push('double')}
  enqueue([ev],mode+(f.type2?' ('+f.type2+')':'')+' '+labelOf(pr,a));
  if(REMOVES[type])localTake(a,temp||'Chilled');
  warn.length?warnTone():okTone();
  showCard(warn.length?'hold':'ok',packHtml(pr,a,stockLine(a,temp||'Chilled'),tags)+(warn.indexOf('double')>=0?'<button class="sm warn" id="undonow">Undo this scan</button>':''));
  if($('undonow'))$('undonow').onclick=()=>undo(recent.length-1);
}
/* boxes: the box label (barcode) is made on the weigh scales and scanned in when the box is finished. Its barcode is the box ID. */
const allBoxes=()=>{const seen={},out=[];((ref&&ref.boxes)||[]).concat(LS('localBoxes',[])).forEach(b=>{if(!seen[b.id]){seen[b.id]=1;out.push(b)}});return out};
const findBox=id=>allBoxes().find(b=>b.id===id)||null;
const findBoxByScan=code=>allBoxes().find(b=>b.id===code||b.id.indexOf(code+'#')===0)||null;   // several boxes can share one label code: any of them will do
const boxRef=b=>'BOX:'+b.id;
const BOX_VERB={Out:'sent out',Writeoff:'written off',Return:'returned',Freeze:'frozen',Thaw:'thawed'};
function setBoxTemp(b,temp){
  const fix=l=>l.forEach(x=>{if(x.id===b.id){x.temp=temp;(x.packs||[]).forEach(p=>{if(p.key)p.key=p.key.replace(/-[CF]$/,temp==='Frozen'?'-F':'-C')})}});
  if(ref&&ref.boxes){fix(ref.boxes);SV('ref',ref)}
  const lb=LS('localBoxes',[]);fix(lb);SV('localBoxes',lb);
}
async function doBoxAction(pr,type,f){
  const b=pr.boxRec||findBox(pr.code);
  if(!b)return scanBad(pr.code,'This box is not in the data on this phone. Refresh the data (Settings > Save and connect) and try again.');
  if(['Online','Offline'].indexOf(type)>=0)return scanBad(pr.code,'Boxes are not put online or taken offline here.');
  if(type==='Freeze'&&b.temp==='Frozen')return scanBad(pr.code,'This box is already frozen.');
  if(type==='Thaw'&&b.temp==='Chilled')return scanBad(pr.code,'This box is already chilled.');
  if(!b.packs.length)return scanBad(pr.code,'This box has no packs recorded.');
  if(!await confirmD(mode+' box '+b.id,'<p>'+b.packs.length+' packs ('+esc(b.type||'box')+', '+esc(b.temp||'')+') will be '+BOX_VERB[type]+'.</p>',mode))return;
  const t=type==='Freeze'?'Frozen':type==='Thaw'?'Chilled':b.temp;
  const evs=b.packs.map(p=>mkEvent(type,p.barcode,Object.assign({},f,{reference:boxRef(b),temperature:t})));
  enqueue(evs,mode+' box '+b.id+' ('+b.packs.length+' packs)');
  if(type==='Freeze'||type==='Thaw')setBoxTemp(b,t);
  okTone();
  showCard('ok','<div class="big">Box '+esc(b.id)+'</div><div class="mut">'+b.packs.length+' packs · '+esc(mode)+(f.type2?' · '+esc(f.type2):'')+(t?' · now '+esc(t.toLowerCase()):'')+'</div>');
}
function boxTypes(){const s={};allBoxes().forEach(b=>{if(b.type)s[b.type]=1});return Object.keys(s)}
const SRC_SEG=(id,label,val)=>'<label class="f">'+label+'</label>'+seg(id,[{v:'Chilled',t:'Chilled'},{v:'Frozen',t:'Frozen'}],val);
function renderBox(){

  if(doneBox){
    u.innerHTML='<div class="big" style="font-weight:700">Box saved</div><div class="mut" style="font-size:.9rem;color:var(--steel)">'+esc(doneBox.id)+'<br>'+doneBox.packs.length+' packs · '+esc(doneBox.type)+' · '+esc(doneBox.temp)+'</div><button id="bnew" class="go" style="width:100%;margin-top:8px">Build another box</button>';
    $('bnew').onclick=()=>{doneBox=null;renderBox()};return;
  }
  if(!boxB){
    u.innerHTML='<label class="f" for="b_type">Box type (free text until the box types are decided)</label><input type="text" id="b_type" list="b_types" value="'+esc(sticky.boxType||'')+'"><datalist id="b_types">'+boxTypes().map(t=>'<option value="'+esc(t)+'">').join('')+'</datalist>'+

async function loadZX(){

async function initDetector(){
  if(det||zx)return;

  await loadZX();zx=new ZXing.MultiFormatReader();zx.setHints(new Map([[ZXing.DecodeHintType.TRY_HARDER,true]]));

async function detect(){

  const w=640,h=Math.round(w*v.videoHeight/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
  try{const r=zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))),k=v.videoWidth/w;
    return[{raw:r.getText(),pts:r.getResultPoints().map(p=>[p.getX()*k,p.getY()*k])}]}catch(e){return[]}

  o.width=o.clientWidth;o.height=o.clientHeight;ctx.clearRect(0,0,o.width,o.height);
  const vw=v.videoWidth,vh=v.videoHeight,s=Math.max(o.width/vw,o.height/vh),dx=(o.width-vw*s)/2,dy=(o.height-vh*s)/2;
  for(const it of list){
    let p=it.pts.map(([x,y])=>[x*s+dx,y*s+dy]);
    if(p.length<4){const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),a=Math.min(...xs)-14,b=Math.min(...ys)-30,c=Math.max(...xs)+14,d=Math.max(...ys)+30;p=[[a,b],[c,b],[c,d],[a,d]]}
    ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.lineWidth=6;ctx.lineJoin='round';ctx.strokeStyle=it.color;ctx.stroke();
  }
}
function handle(list,now){
  const auto=$('auto').value==='1',strict=$('dup').value==='strict';
  cand=null;let blocked=false;
  for(const it of list){
    cand=cand||it.raw;
    const dup=it.raw===lastCap&&(strict||now-lastCapSeen<REARM);
    if(it.raw===lastCap)lastCapSeen=now;
    it.color=(auto&&dup)?HOLD:GO;if(auto&&dup)blocked=true;
  }
  if(list.length)lastActive=now;
  if(cand&&cand===seen)seenN++;else{seen=cand;seenN=cand?1:0}
  $('cap').disabled=auto||!cand;$('cap').classList.toggle('ready',!auto&&!!cand);
  $('cap').textContent=auto?'Capture (auto scan is on)':'Capture';
  if(auto&&cand&&!blocked&&seenN>=2)capture(cand);
  draw(list);
}
async function tick(){
  if(!running)return;const now=performance.now();
  if(now-lastTick>90&&v.readyState>=2){lastTick=now;let l=[];try{l=await detect()}catch(e){}handle(l,now)}
  const left=IDLE-(now-lastActive);
  if(left<=0)return stop('Camera paused after 60 s idle. Tap Enable camera.');
  msg(left<15000?'Camera sleeps in '+Math.ceil(left/1000)+' s':'Camera on · sleeps after 60 s idle');
  requestAnimationFrame(tick);
}
async function start(){
  audio();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){return msg('Camera unavailable: '+e.name+'. Open this page over HTTPS.')}
  v.srcObject=stream;await v.play();track=stream.getVideoTracks()[0];
  $('torch').hidden=!(track.getCapabilities&&track.getCapabilities().torch);
  msg('Starting decoder…');try{await initDetector()}catch(e){stop('Could not load a barcode decoder.');return}
  running=true;lastActive=performance.now();$('power').textContent='Stop camera';lock(true);tick();
}
function stop(m){
  running=false;lock(false);if(stream)stream.getTracks().forEach(t=>t.stop());v.srcObject=null;torchOn=false;
  ctx.clearRect(0,0,o.width,o.height);$('power').textContent='Enable camera';$('cap').disabled=true;msg(m||'Camera is off');
}
$('power').onclick=()=>running?stop():start();
$('torch').onclick=()=>{torchOn=!torchOn;track.applyConstraints({advanced:[{torch:torchOn}]})};
$('cap').onclick=()=>{if(cand)capture(cand)};
document.addEventListener('pointerdown',()=>lastActive=performance.now());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stop('Camera paused while the app is in the background.')});
let wl;
async function lock(on){try{if(on)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null}}catch(e){}}

/* ============================== handheld Bluetooth scanner (keyboard mode) ============================== */
/* A scan is a fast burst of characters followed by Enter. Old labels: 11-13 digits. New labels: digits and ( ) ~ | (the scanner should send
   the FNC1 separator as ~ or |). Box labels: BOX-... A burst that is not a recognised barcode is a read error. */
let src='cam',scanTimer;const si=$('scan');
const burstOk=b=>/^[0-9A-Za-z()~|\x1d-]{8,}$/.test(b);
function scanDone(t){onScan(t)}
let lastUi=Date.now();
['pointerdown','keydown','input'].forEach(t=>addEventListener(t,()=>lastUi=Date.now(),true));
function focusScan(){
  if(src!=='bt'||modalOpen||!$('settings').hidden)return;
  const a=document.activeElement,tag=a&&a!==si?a.tagName:'',idle=Date.now()-lastUi;
  if((tag==='SELECT'&&idle<10000)||((tag==='INPUT'||tag==='TEXTAREA')&&idle<30000))return;
  si.focus({preventScroll:true});
}
si.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(scanTimer);const t=si.value;si.value='';if(t)scanDone(t)}});
si.addEventListener('input',()=>{clearTimeout(scanTimer);scanTimer=setTimeout(()=>{const t=si.value;si.value='';if(t)scanBad(t,'The read was cut short. Scan again.')},700)});
let kb='',kt=-1e9;
addEventListener('keydown',e=>{
  if(src!=='bt'||e.isComposing||modalOpen)return;
  const now=performance.now();
  $('dbg').textContent='Scanner readout: key '+e.key+' · burst '+kb.length+' chars · gap '+Math.round(now-kt)+' ms';
  if(e.key==='Enter'){
    const b=kb;kb='';
    if(burstOk(b)){
      e.preventDefault();e.stopImmediatePropagation();
      const a=document.activeElement;
      if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value.endsWith(b))a.value=a.value.slice(0,-b.length);
      clearTimeout(scanTimer);scanDone(b);
    }
    return;
  }
  if(e.key.length===1){kb=(now-kt<250?kb:'')+e.key;kt=now}
  else if(!['Shift','CapsLock','Alt','Control','Meta','AltGraph'].includes(e.key))kb='';
},true);
function setSrc(s){
  src=s;localStorage.ecfbsrc=s;$('src').value=s;
  if(s==='bt'&&running)stop();
  document.querySelectorAll('.camonly').forEach(e=>e.hidden=s!=='cam');
  $('btui').hidden=s!=='bt';si.value='';
  if(s==='bt')focusScan();else si.blur();
}
$('src').onchange=e=>setSrc(e.target.value);
addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&src==='bt'){e.target.blur();setTimeout(focusScan,50)}});
$('note').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('note').blur();setTimeout(focusScan,50)}});
document.addEventListener('pointerdown',e=>{
  if(src==='bt'&&!e.target.closest('input,select,textarea,label,button')){
    const a=document.activeElement;if(a&&a!==si&&/^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName))a.blur();setTimeout(focusScan,50)}
});
setInterval(focusScan,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)focusScan()});
document.addEventListener('keydown',()=>{if(src==='bt')audio()});

/* ============================== settings, install, start ============================== */
function openSettings(){
  $('s_dev').value=cfg.device||'';$('s_url').value=cfg.url||'';$('s_url').placeholder=DEFAULT_URL?'Leave blank to use the built-in address':'https://script.google.com/macros/s/.../exec';$('s_tok').value=cfg.token||'';
  setStat('Build '+BUILD+(ref?' · data version '+ref.version+' · '+plist().length+' products':'')+' · '+queue.length+' waiting to send');
  $('settings').hidden=false;
}
$('openset1').onclick=openSettings;$('rolebtn').onclick=showRoles;$('q').onclick=openSettings;
$('s_close').onclick=()=>{$('settings').hidden=true;checkSetup();focusScan()};
$('s_save').onclick=async()=>{
  const dev=$('s_dev').value.trim(),url=$('s_url').value.trim(),tok=$('s_tok').value.trim();
  if(!dev)return setStat('Give this phone a name first.');
  cfg={device:dev,url:url||DEFAULT_URL,token:tok};SV('cfg',cfg);lastErr='';setStat('Connecting…');
  if(url){await refresh(true);flush()}else setStat('Saved. Add the web app address to connect.');
  checkSetup();
};
$('s_send').onclick=async()=>{await flush();setStat(queue.length?queue.length+' still waiting. '+(lastErr||'Check the connection.'):'All sent.')};
$('s_clear').onclick=async()=>{if(await confirmD('Clear cached data?','<p>Products, stock and the pick list are downloaded again when you are online. Unsent scans ('+queue.length+') are kept.</p>','Clear')){ref=null;PM={};SV('ref',null);localStorage.removeItem('ecfb.localBoxes');showStatus();renderOpts();setStat('Cleared.')}};
function checkSetup(){
  const n=$('setupnote');
  if(!cfg.device||!cfg.url||!cfg.token){n.hidden=false;n.innerHTML='This phone is not set up yet. <button class="sm go" id="setbtn">Open Settings</button>';$('setbtn').onclick=openSettings}
  else if(!ref){n.hidden=false;n.textContent='No product data on this phone yet. It downloads when you are online.'}
  else n.hidden=true;
}
function applyHashSetup(){   // https://.../index.html#setup&u=<web app address>&t=<token>&d=<device name>  (the part after # is never sent to a server)
  if(!/^#setup/.test(location.hash))return;
  const p=new URLSearchParams(location.hash.slice(1));
  cfg={url:p.get('u')||cfg.url,token:p.get('t')||cfg.token,device:p.get('d')||cfg.device};SV('cfg',cfg);
  history.replaceState(null,'',location.pathname+location.search);
}
let ip;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('install').hidden=false});
addEventListener('appinstalled',()=>$('install').hidden=true);
$('install').onclick=async()=>{ip.prompt();await ip.userChoice;$('install').hidden=true};
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)$('upd').hidden=false})}
$('upd').onclick=()=>location.reload();
$('ver').textContent='Build '+BUILD+' (beta)';
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

applyHashSetup();
if(ref&&!sticky.origin)sticky.origin=(ref.settings||{}).defaultOrigin||'ECF';
if(!sticky.origin)sticky.origin='ECF';
showStatus();renderRecent();checkSetup();
if(!cfg.device||!cfg.url){openSettings()}
if(MODES[role])setRole(role);else showRoles();
refresh();flush();
</script>
